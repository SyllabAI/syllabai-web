name: Pilot Monitor

# Minimum operational monitoring for the controlled pilot (DEPLOYMENT.md §4,
# session-58). Probes the deployed Render backend + Vercel web over real HTTP
# and reports to the existing Discord webhook. No new observability system —
# GitHub Actions cron + the secrets that already exist.
#
# Secrets used (all optional-with-graceful-skip except the monitor account):
#   DISCORD_WEBHOOK_URL     reporting channel (pre-existing)
#   PILOT_MONITOR_EMAIL     pilot.monitor@syllabai-test.dev (TEST-classified
#                           learner account, session-58)
#   PILOT_MONITOR_PASSWORD  its credentials
#   PILOT_TEACHER_EMAIL     set AFTER the pilot tutor is provisioned (runbook
#   PILOT_TEACHER_PASSWORD  §2) — unlocks the teacher KG + activation checks
#
# Schedules:
#   */6h   — full probe set (read-only; teacher activation check excluded)
#   Sun 09:33 UTC — weekly ops run: adds the idempotent re-activation
#            verification and the operator checklist (evidence export, κ,
#            feedback triage) to the Discord report.

on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "33 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Probe production pilot surfaces
        env:
          BACKEND_URL: https://syllabai-core.onrender.com
          WEB_URL: https://syllabai-web.vercel.app
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONITOR_EMAIL: ${{ secrets.PILOT_MONITOR_EMAIL }}
          MONITOR_PASSWORD: ${{ secrets.PILOT_MONITOR_PASSWORD }}
          TEACHER_EMAIL: ${{ secrets.PILOT_TEACHER_EMAIL }}
          TEACHER_PASSWORD: ${{ secrets.PILOT_TEACHER_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ops/pilot_probe.py
